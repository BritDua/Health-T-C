<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana Health & Fitness</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#CE1126">
    <meta name="description" content="30-day Ghanaian meal plan and 4-week workout program for health optimization">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
</head>
<body>
    <div id="app" class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>🇬🇭 Ghana Health</h1>
                <p class="header-subtitle">30-Day Meal Plan • 4-Week Workout</p>
            </div>
        </header>

        <main class="main-content" id="mainContent">
            <!-- Content rendered dynamically by app.js -->
            <div class="loading-state">
                <div class="loader"></div>
                <p>Loading your health plan...</p>
            </div>
        </main>

        <nav class="bottom-nav" id="bottomNav" role="navigation" aria-label="Main navigation">
            <button class="nav-btn active" data-tab="meals" aria-label="Meals" aria-current="page">
                <span class="nav-icon">🍽️</span>
                <span class="nav-label">Meals</span>
            </button>
            <button class="nav-btn" data-tab="workouts" aria-label="Workouts">
                <span class="nav-icon">💪</span>
                <span class="nav-label">Workouts</span>
            </button>
            <button class="nav-btn" data-tab="shopping" aria-label="Shopping List">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Shopping</span>
            </button>
            <button class="nav-btn" data-tab="progress" aria-label="Progress Tracker">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Progress</span>
            </button>
        </nav>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" aria-label="Close modal">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js" type="module"></script>
</body>
</html>
